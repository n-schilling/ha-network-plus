target-version = "py314"
line-length = 100

[lint]
select = ["F", "E9", "B", "UP", "I", "ASYNC", "SIM", "RUF"]
ignore = ["RUF012"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.network_plus"]
known-third-party = ["pytest_homeassistant_custom_component"]
combine-as-imports = true
split-on-trailing-comma = false
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]

[lint.isort.sections]
homeassistant = ["homeassistant"]
