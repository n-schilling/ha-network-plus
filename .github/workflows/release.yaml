name: Release

# On each push to main: when CI passed for the commit (it ran on dev, CI does
# not run again on main; .github/scripts/ci-passed.sh), tag the version from
# manifest.json and publish a GitHub release with its CHANGELOG section,
# unless that tag exists. The Marketplace offers each release as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  checks: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Started by hand only on main
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-passed.sh "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
      - name: Release the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '.version' custom_components/network_plus/manifest.json)
          name=$(jq -r '.name' custom_components/network_plus/manifest.json)
          tag="v${version}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '${version}' in manifest.json is no x.y.z"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} exists, nothing to release"
            exit 0
          fi
          .github/scripts/changelog-section.sh CHANGELOG.md "${version}" > notes.md
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${name} ${version}" --notes-file notes.md
