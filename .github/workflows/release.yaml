name: Release

# After a green CI run on main: tag the version from manifest.json and
# publish a GitHub release with its CHANGELOG section, unless that tag exists.
# HACS offers each release as an update.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    # Only for pushes to main of this repository, never for pull requests or
    # forks, which can name a branch main as well
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Release the version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(jq -r '.version' custom_components/network_plus/manifest.json)
          name=$(jq -r '.name' custom_components/network_plus/manifest.json)
          tag="v${version}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '${version}' in manifest.json is no x.y.z"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} exists, nothing to release"
            exit 0
          fi
          .github/scripts/changelog-section.sh CHANGELOG.md "${version}" > notes.md
          gh release create "${tag}" --target "${SHA}" --title "${name} ${version}" --notes-file notes.md
