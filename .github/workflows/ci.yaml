name: CI
# scripts/check.sh runs the same checks locally; keep the two in step.

# Not on main: a commit reaches main only after CI passed for it on dev, and
# the release workflow checks that before it tags (ci-passed.sh)
on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    # Weekly, so a new Home Assistant release that breaks hassfest shows up
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Ruff
        run: |
          pip install "$(grep '^ruff==' requirements_test.txt)"
          ruff check .
          ruff format --check .
      - name: Changelog has the version
        run: .github/scripts/changelog-section.sh CHANGELOG.md "$(jq -r '.version' custom_components/network_plus/manifest.json)" > /dev/null
      - name: Translations match strings.json
        run: diff custom_components/network_plus/strings.json custom_components/network_plus/translations/en.json

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-26

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # HACS cannot read the files of a private repository; runs once it is public
    if: ${{ !github.event.repository.private }}
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # No brand images yet, and none in home-assistant/brands
          ignore: brands

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.14"
      # The whole virtual environment, by the exact Python version and the
      # requirements: on a hit nothing is installed. No pip cache besides: its
      # key changes with the same inputs, so it would only cost time to restore
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: venv
        with:
          path: .venv
          key: venv-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements_test.txt') }}
      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements_test.txt
      - name: Use the virtual environment
        run: echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Strict typing
        run: mypy custom_components
      - name: Test
        # Silver of the quality scale asks for more than 95 %; this repo keeps 99 %
        run: pytest -v --cov=custom_components.network_plus --cov-report=term-missing --cov-fail-under=99

  page:
    name: Page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.14"
      # Home Assistant starts only inside a virtual environment. The whole of
      # it, by the exact Python version and the requirements: on a hit nothing
      # is installed (no pip cache besides, as in Tests)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: venv
        with:
          path: .venv-panel
          key: venv-panel-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements_panel.txt') }}
      - name: Install
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv-panel
          .venv-panel/bin/pip install -r requirements_panel.txt
      # The runner's Google Chrome, like Crash Guard; Playwright's Chromium
      # (and its packages from apt) only where there is none
      - name: Browser
        run: |
          if ! command -v google-chrome > /dev/null; then
            .venv-panel/bin/python -m playwright install --with-deps chromium
          fi
      - name: Check the page in a browser
        run: |
          browser=chromium
          if command -v google-chrome > /dev/null; then browser=chrome; fi
          .venv-panel/bin/python -I scripts/panel/check_panel.py --browser "$browser"
