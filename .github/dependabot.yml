version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Home Assistant itself, its frontend and test harness: moved by hand with each HA release
      - dependency-name: homeassistant
      - dependency-name: home-assistant-frontend
      - dependency-name: pytest-homeassistant
